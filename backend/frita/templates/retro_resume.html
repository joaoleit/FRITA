<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Resumo da Retrospectiva</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12pt; margin: 30px; }
        h1 { text-align: center; font-size: 20pt; }
        p { margin-bottom: 10px; }
        .resume { margin-top: 20px; white-space: pre-line; }
    </style>
</head>
<body>
    <h1>Resumo da Retrospectiva</h1>
    <p><strong>Nome:</strong> {{ retro.name }}</p>
    <p><strong>Projeto:</strong> {{ retro.project.name }}</p>
    <p><strong>Tipo:</strong> {{ retro.retro_type }}</p>
    <p><strong>Data:</strong> {{ retro.created_at|date:"d/m/Y H:i" }}</p>

    <div class="resume">{{ retro.resume }}</div>
</body>
</html>
